name: release
on:
  push: {tags: ["v*"]}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.13"}
      - run: pip install build pytest && pytest -q && python -m build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with: {subject-path: "dist/*"}
      - name: Publish the release with its files in one step
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
